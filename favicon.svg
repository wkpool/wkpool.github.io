<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#111120"/>
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff9a6c"/>
      <stop offset="50%"  stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#e84393"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9b6de8"/>
      <stop offset="100%" stop-color="#5a3fa0"/>
    </linearGradient>
    <linearGradient id="midpurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c5cbf"/>
      <stop offset="100%" stop-color="#b48af5"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#ff4d6d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <!-- iOS squircle clip -->
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- Coral glow from bottom -->
    <rect width="1024" height="1024" fill="url(#coralGlow)"/>

    <!-- "26" gecentreerd — coral + purple per cijfer via tspan -->
    <text
      x="512" y="780"
      font-family="Arial Black, sans-serif"
      font-weight="900"
      font-size="840"
      text-anchor="middle"
    ><tspan fill="url(#coral)">2</tspan><tspan fill="url(#purple)">6</tspan></text>

    <!-- Mid overlay "26" gecentreerd -->
    <text
      x="512" y="752"
      font-family="Arial Black, sans-serif"
      font-weight="900"
      font-size="760"
      fill="url(#midpurple)"
      text-anchor="middle"
      opacity="0.25"
    >26</text>

    <!-- ⚽ Ball -->
    <text
      x="512" y="544"
      font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif"
      font-size="352"
      text-anchor="middle"
      dominant-baseline="middle"
    >⚽</text>

    <!-- WK POOL -->
    <text
      x="512" y="912"
      font-family="Arial Black, sans-serif"
      font-weight="900"
      font-size="104"
      fill="white"
      text-anchor="middle"
      letter-spacing="16"
      opacity="0.9"
    >WK POOL</text>
  </g>
</svg>
