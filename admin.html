<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WK Pool 2026 — Admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #111118;
      --bg2:      #1a1a24;
      --bg3:      #22222e;
      --card:     #1e1e2a;
      --pink:     #ff4d6d;
      --teal:     #00d4aa;
      --red:      #ff4d6d;
      --purple-l: #b48af5;
      --text:     rgba(255,255,255,0.92);
      --text-mid: rgba(255,255,255,0.55);
      --text-dim: rgba(255,255,255,0.28);
      --border:   rgba(255,255,255,0.07);
      --font:     'Poppins', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(124,92,191,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(255,77,109,0.06) 0%, transparent 55%);
    }

    .hidden { display: none !important; }

    /* ── LOGIN ── */
    #login-section {
      position: relative; z-index: 5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      max-width: 380px; width: 100%;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    .login-logo  { font-size: 40px; margin-bottom: 0.75rem; line-height: 1; }
    .login-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--pink); margin-bottom: 0.4rem;
    }
    .login-title { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 1.25rem; }

    .input-group {
      display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem;
    }

    .input-group .btn-primary { width: 100%; justify-content: center; }

    .dark-input {
      flex: 1; padding: 0.6rem 0.9rem;
      background: var(--bg3);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      font-family: var(--font); font-size: 15px;
      color: var(--text); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .dark-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255,77,109,0.18);
    }

    .dark-input::placeholder { color: var(--text-dim); }

    .btn-primary {
      padding: 0.6rem 1.1rem;
      background: linear-gradient(135deg, #ff6b8a, #ff4d6d);
      color: white; border: none; border-radius: 10px;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: opacity .15s;
      box-shadow: 0 8px 20px rgba(255,77,109,0.3);
    }

    .btn-primary:hover    { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary.saved    { background: var(--teal); box-shadow: 0 8px 20px rgba(0,212,170,0.25); }

    .error-msg { font-size: 13px; color: var(--red); margin-top: 0.5rem; }

    /* ── NAV ── */
    .app-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(26,26,36,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 720px; margin: 0 auto;
      padding: 0 1.25rem; height: 52px;
      display: flex; align-items: center; gap: 0.25rem;
      position: relative; z-index: 5;
    }

    .nav-brand { font-weight: 800; font-size: 17px; letter-spacing: -0.03em; margin-right: 0.75rem; }

    .admin-badge {
      font-size: 11px; font-weight: 700;
      color: #ffb800;
      background: rgba(255,184,0,0.12);
      border: 1px solid rgba(255,184,0,0.25);
      border-radius: 99px; padding: 2px 10px; margin-right: 1rem;
    }

    .nav-tabs { display: flex; gap: 2px; }

    .nav-tab {
      padding: 0.35rem 0.9rem; border: none; background: none;
      font-family: var(--font); font-size: 14px; font-weight: 400;
      cursor: pointer; color: var(--text-mid);
      border-radius: 8px; transition: all .15s;
    }

    .nav-tab.active { color: var(--text); font-weight: 600; background: rgba(255,255,255,0.06); }
    .nav-tab:hover:not(.active) { color: var(--text); }

    /* ── MAIN ── */
    main {
      max-width: 720px; margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      position: relative; z-index: 5;
    }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 1.25rem; margin-bottom: 1rem;
    }

    .card-title {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 0.85rem;
    }

    .section-label {
      font-size: 11px; font-weight: 700; color: var(--text-dim);
      letter-spacing: .08em; text-transform: uppercase;
      margin: 1.5rem 0 0.6rem;
    }

    /* ── PARTICIPANT ROWS ── */
    .deelnemer-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 0.9rem 1.1rem; margin-bottom: 0.5rem;
    }

    .deelnemer-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem;
    }

    .deelnemer-info { display: flex; align-items: center; gap: 10px; }

    .deelnemer-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #9b6de8, #ff4d6d);
      color: white; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .deelnemer-naam { font-size: 15px; font-weight: 600; }

    .btn-destructive {
      padding: 0.3rem 0.75rem;
      background: none; color: var(--red);
      border: 1px solid rgba(255,77,109,0.25);
      border-radius: 8px; font-family: var(--font); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }

    .btn-destructive:hover { background: rgba(255,77,109,0.08); }

    .link-box {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.45rem 0.75rem;
      cursor: pointer; transition: border-color .15s;
    }

    .link-box:hover { border-color: rgba(180,138,245,0.4); }

    .link-url {
      font-family: ui-monospace, monospace; font-size: 12px;
      color: var(--text-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .copy-hint { font-size: 13px; font-weight: 600; color: var(--purple-l); white-space: nowrap; flex-shrink: 0; }

    /* ── MATCH CARDS (admin) ── */
    .match-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 0.5rem;
    }

    .match-card.has-score { border-color: rgba(0,212,170,0.3); }

    .match-teams { font-size: 16px; font-weight: 600; margin-bottom: 0.2rem; }
    .match-date  { font-size: 12px; color: var(--text-dim); margin-bottom: 0.75rem; }

    .score-form { display: flex; align-items: center; gap: 0.5rem; }

    .score-input {
      width: 52px; height: 40px; text-align: center;
      font-family: var(--font); font-size: 17px; font-weight: 700;
      background: var(--bg3); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: var(--text); outline: none;
      transition: border-color .15s, box-shadow .15s;
      -moz-appearance: textfield;
    }

    .score-input::-webkit-inner-spin-button,
    .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    .score-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255,77,109,0.18);
    }

    .score-sep { font-size: 15px; color: var(--text-dim); }

    .btn-secondary {
      padding: 0.4rem 0.85rem; background: none; color: var(--red);
      border: 1px solid rgba(255,77,109,0.25); border-radius: 8px;
      font-family: var(--font); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }

    .btn-secondary:hover { background: rgba(255,77,109,0.08); }

    .empty-state {
      text-align: center; color: var(--text-dim);
      padding: 2rem 1rem; font-size: 14px;
    }

    /* ── VOORSPELLINGEN ── */
    .pred-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 0.9rem 1.1rem; margin-bottom: 0.5rem;
    }

    .pred-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem;
    }

    .pred-count { font-size: 14px; font-weight: 700; }

    .pred-bar-bg {
      height: 5px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden;
    }

    .pred-bar-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease; }

    @media (max-width: 480px) {
      .nav-brand { font-size: 15px; }
      main { padding: 1rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-section">
  <div class="login-card">
    <div class="login-logo">⚽</div>
    <div class="login-eyebrow">WK Pool 2026</div>
    <div class="login-title">Beheerder</div>
    <div class="input-group">
      <input type="password" class="dark-input" id="wachtwoord-input" placeholder="Wachtwoord" />
      <button class="btn-primary" id="login-btn">Inloggen</button>
    </div>
    <p class="error-msg hidden" id="login-error">Onjuist wachtwoord</p>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-section" class="hidden">
  <nav class="app-nav">
    <div class="nav-inner">
      <div class="nav-brand">WK Pool 2026</div>
      <span class="admin-badge">Admin</span>
      <div class="nav-tabs">
        <button class="nav-tab active" data-tab="deelnemers">Deelnemers</button>
        <button class="nav-tab" data-tab="uitslagen">Uitslagen</button>
        <button class="nav-tab" data-tab="voorspellingen">Voorspellingen</button>
      </div>
    </div>
  </nav>

  <main>
    <!-- Deelnemers -->
    <div id="tab-deelnemers" class="tab-content">
      <div class="card" style="margin-top:0.5rem">
        <div class="card-title">Nieuwe deelnemer</div>
        <div class="input-group" style="margin-bottom:0">
          <input type="text" class="dark-input" id="naam-input" placeholder="Naam" />
          <button class="btn-primary" id="toevoegen-btn">Voeg toe</button>
        </div>
      </div>
      <div class="section-label">Deelnemers</div>
      <div id="deelnemers-lijst"></div>
    </div>

    <!-- Uitslagen -->
    <div id="tab-uitslagen" class="tab-content hidden">
      <div id="uitslagen-lijst"></div>
    </div>

    <!-- Voorspellingen -->
    <div id="tab-voorspellingen" class="tab-content hidden"></div>
  </main>
</div>

<script>
  const WACHTWOORD = 'afblijven'

  document.getElementById('login-btn').addEventListener('click', checkWachtwoord)
  document.getElementById('wachtwoord-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkWachtwoord()
  })

  function checkWachtwoord() {
    const input = document.getElementById('wachtwoord-input')
    if (input.value === WACHTWOORD) {
      sessionStorage.setItem('admin_auth', '1')
      document.dispatchEvent(new CustomEvent('admin-login'))
    } else {
      document.getElementById('login-error').classList.remove('hidden')
      input.style.borderColor = 'var(--red)'
      setTimeout(() => { input.style.borderColor = '' }, 1500)
    }
  }
</script>

<script type="module">
  import { supabase } from './supabase.js'

  const BASE_URL = window.location.origin + window.location.pathname.replace('admin.html', '')

  function toonAdmin() {
    document.getElementById('login-section').classList.add('hidden')
    document.getElementById('admin-section').classList.remove('hidden')
    toonTab('deelnemers')
  }

  document.addEventListener('admin-login', toonAdmin)
  if (sessionStorage.getItem('admin_auth') === '1') toonAdmin()

  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.addEventListener('click', () => toonTab(btn.dataset.tab))
  })

  function toonTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'))
    document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'))
    document.getElementById(`tab-${tab}`).classList.remove('hidden')
    document.querySelector(`.nav-tab[data-tab="${tab}"]`).classList.add('active')
    if (tab === 'deelnemers')    laadDeelnemers()
    if (tab === 'uitslagen')     laadUitslagen()
    if (tab === 'voorspellingen') laadVoorspellingen()
  }

  function initialen(naam) {
    const parts = (naam || '??').trim().split(' ')
    return parts.length >= 2
      ? (parts[0][0] + parts[1][0]).toUpperCase()
      : (naam || '??').slice(0, 2).toUpperCase()
  }

  // ── Deelnemers ──────────────────────────────────────────

  async function laadDeelnemers() {
    const { data } = await supabase.from('participants').select('*').order('name')
    const lijst = document.getElementById('deelnemers-lijst')
    lijst.innerHTML = ''
    if (!data || data.length === 0) {
      lijst.innerHTML = '<p class="empty-state">Nog geen deelnemers toegevoegd</p>'
      return
    }
    data.forEach(d => lijst.appendChild(maakDeelnemerRij(d)))
  }

  function maakDeelnemerRij(deelnemer) {
    const link = `${BASE_URL}?token=${deelnemer.token}`
    const row = document.createElement('div')
    row.className = 'deelnemer-row'
    row.id = `rij-${deelnemer.id}`
    row.innerHTML = `
      <div class="deelnemer-top">
        <div class="deelnemer-info">
          <div class="deelnemer-avatar">${initialen(deelnemer.name)}</div>
          <span class="deelnemer-naam">${deelnemer.name}</span>
        </div>
        <button class="btn-destructive verwijder-btn">Verwijder</button>
      </div>
      <div class="link-box">
        <span class="link-url">${link}</span>
        <span class="copy-hint">Kopieer</span>
      </div>
    `
    row.querySelector('.link-box').addEventListener('click', () => kopieerLink(link, row))
    row.querySelector('.verwijder-btn').addEventListener('click', () => verwijder(deelnemer.id))
    return row
  }

  async function kopieerLink(link, row) {
    await navigator.clipboard.writeText(link)
    const hint = row.querySelector('.copy-hint')
    hint.textContent = '✓ Gekopieerd'
    hint.style.color = 'var(--teal)'
    setTimeout(() => { hint.textContent = 'Kopieer'; hint.style.color = '' }, 1500)
  }

  document.getElementById('toevoegen-btn').addEventListener('click', voegToe)
  document.getElementById('naam-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') voegToe()
  })

  async function voegToe() {
    const naam = document.getElementById('naam-input').value.trim()
    if (!naam) return
    const token = naam.toLowerCase().replace(/\s+/g, '-') + '-' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36)
    const { data, error } = await supabase.from('participants').insert({ name: naam, token }).select().single()
    if (error) { alert('Fout: ' + error.message); return }
    document.getElementById('naam-input').value = ''
    document.getElementById('deelnemers-lijst').prepend(maakDeelnemerRij(data))
  }

  async function verwijder(id) {
    if (!confirm('Deelnemer verwijderen?')) return
    await supabase.from('participants').delete().eq('id', id)
    document.getElementById(`rij-${id}`)?.remove()
  }

  // ── Uitslagen ────────────────────────────────────────────

  async function laadUitslagen() {
    const { data: matches } = await supabase.from('matches').select('*').order('date')
    const container = document.getElementById('uitslagen-lijst')
    container.innerHTML = ''

    if (!matches || matches.length === 0) {
      container.innerHTML = '<p class="empty-state">Nog geen wedstrijden</p>'
      return
    }

    const groepen = [...new Set(matches.map(m => m.poule).filter(Boolean))].sort()

    groepen.forEach(poule => {
      const header = document.createElement('div')
      header.className = 'section-label'
      header.textContent = `Groep ${poule}`
      container.appendChild(header)
      matches.filter(m => m.poule === poule).forEach(match => {
        container.appendChild(maakUitslagKaart(match))
      })
    })

    const zonderPoule = matches.filter(m => !m.poule)
    if (zonderPoule.length > 0) {
      const header = document.createElement('div')
      header.className = 'section-label'
      header.textContent = 'Overig'
      container.appendChild(header)
      zonderPoule.forEach(match => container.appendChild(maakUitslagKaart(match)))
    }
  }

  function maakUitslagKaart(match) {
    const card = document.createElement('div')
    const heeftUitslag = match.score_home !== null && match.score_away !== null
    card.className = `match-card${heeftUitslag ? ' has-score' : ''}`

    card.innerHTML = `
      <div class="match-teams">${match.home} × ${match.away}</div>
      ${match.date ? `<div class="match-date">${formatDate(match.date)}</div>` : ''}
      <div class="score-form">
        <input type="number" min="0" max="20" class="score-input" id="home-${match.id}" value="${match.score_home ?? ''}">
        <span class="score-sep">–</span>
        <input type="number" min="0" max="20" class="score-input" id="away-${match.id}" value="${match.score_away ?? ''}">
        <button class="btn-primary opslaan-btn" style="margin-left:auto;padding:0.4rem 0.9rem;font-size:14px">Opslaan</button>
        ${heeftUitslag ? `<button class="btn-secondary wis-btn">Wis</button>` : ''}
      </div>
    `

    card.querySelector('.opslaan-btn').addEventListener('click', () => slaUitslagOp(match.id, card))
    card.querySelector('.wis-btn')?.addEventListener('click', () => wisUitslag(match.id, card))
    return card
  }

  async function wisUitslag(matchId, card) {
    if (!confirm('Uitslag verwijderen?')) return
    const { error } = await supabase.from('matches').update({ score_home: null, score_away: null }).eq('id', matchId)
    if (error) { alert('Fout: ' + error.message); return }
    document.getElementById(`home-${matchId}`).value = ''
    document.getElementById(`away-${matchId}`).value = ''
    card.classList.remove('has-score')
    card.querySelector('.wis-btn')?.remove()
  }

  async function slaUitslagOp(matchId, card) {
    const homeVal = document.getElementById(`home-${matchId}`).value
    const awayVal = document.getElementById(`away-${matchId}`).value
    const btn = card.querySelector('.opslaan-btn')

    if (homeVal === '' || awayVal === '') {
      const h = document.getElementById(`home-${matchId}`)
      const a = document.getElementById(`away-${matchId}`)
      h.style.borderColor = 'var(--red)'; a.style.borderColor = 'var(--red)'
      setTimeout(() => { h.style.borderColor = ''; a.style.borderColor = '' }, 1500)
      return
    }

    btn.textContent = '…'
    btn.disabled = true

    const { error } = await supabase.from('matches').update({
      score_home: parseInt(homeVal),
      score_away: parseInt(awayVal)
    }).eq('id', matchId)

    if (error) {
      alert('Fout: ' + error.message)
      btn.textContent = 'Opslaan'
      btn.disabled = false
    } else {
      btn.textContent = '✓ Opgeslagen'
      btn.classList.add('saved')
      card.classList.add('has-score')
      if (!card.querySelector('.wis-btn')) {
        const wisBtn = document.createElement('button')
        wisBtn.className = 'btn-secondary wis-btn'
        wisBtn.textContent = 'Wis'
        wisBtn.addEventListener('click', () => wisUitslag(matchId, card))
        card.querySelector('.score-form').appendChild(wisBtn)
      }
      setTimeout(() => {
        btn.textContent = 'Opslaan'
        btn.classList.remove('saved')
        btn.disabled = false
      }, 2000)
    }
  }

  // ── Voorspellingen ───────────────────────────────────────

  async function laadVoorspellingen() {
    const container = document.getElementById('tab-voorspellingen')
    container.innerHTML = '<p class="empty-state">Laden…</p>'

    const [{ data: participants }, { data: matches }, { data: predictions }] = await Promise.all([
      supabase.from('participants').select('*').order('name'),
      supabase.from('matches').select('id'),
      supabase.from('predictions').select('participant_id, pred_home').not('pred_home', 'is', null),
    ])

    const totalMatches = (matches || []).length
    container.innerHTML = ''

    if (!participants || participants.length === 0) {
      container.innerHTML = '<p class="empty-state">Geen deelnemers</p>'
      return
    }

    const predCount = {}
    ;(predictions || []).forEach(p => {
      predCount[p.participant_id] = (predCount[p.participant_id] || 0) + 1
    })

    const sorted = [...participants].sort((a, b) => (predCount[b.id] || 0) - (predCount[a.id] || 0))

    const label = document.createElement('div')
    label.className = 'section-label'
    label.textContent = `${totalMatches} wedstrijden totaal`
    container.appendChild(label)

    sorted.forEach(p => {
      const count = predCount[p.id] || 0
      const pct   = totalMatches > 0 ? Math.round(count / totalMatches * 100) : 0
      const color = pct === 100 ? 'var(--teal)' : pct >= 50 ? 'var(--purple-l)' : 'var(--pink)'

      const row = document.createElement('div')
      row.className = 'pred-row'
      row.innerHTML = `
        <div class="pred-top">
          <div class="deelnemer-info">
            <div class="deelnemer-avatar">${initialen(p.name)}</div>
            <span class="deelnemer-naam">${p.name}</span>
          </div>
          <span class="pred-count" style="color:${color}">${count} / ${totalMatches}</span>
        </div>
        <div class="pred-bar-bg">
          <div class="pred-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      `
      container.appendChild(row)
    })
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('nl-NL', {
      weekday: 'short', day: 'numeric', month: 'short',
      hour: '2-digit', minute: '2-digit'
    })
  }
</script>
</body>
</html>
