<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LASERGOAL '26 — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800;12..96,900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --void:        #07010f;
      --night:       #0d0420;
      --plasma:      #160833;
      --plasma-2:    #1f0a47;
      --bone:        #f6f1ff;
      --bone-dim:    #b8a8d6;
      --bone-mute:   #6f5f95;
      --magenta:     #ff2e93;
      --cyan:        #00f0ff;
      --lime:        #c8ff00;
      --orange:      #ff7a00;
      --violet:      #b53dff;
      --display: "Bricolage Grotesque", system-ui, sans-serif;
      --ui:      "Space Grotesk", system-ui, sans-serif;
      --mono:    "JetBrains Mono", ui-monospace, monospace;
      --r-card: 16px;
      --r-pill: 999px;
      --grid-soft: rgba(0,240,255,0.12);
      --grid-hot:  rgba(255,46,147,0.35);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: var(--void);
      color: var(--bone);
      font-family: var(--ui);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* ===================== LOGIN ===================== */
    #login-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 80%, #2a0a6a 0%, #0a0220 55%, #07010f 100%);
    }

    .login-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-hot) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-hot) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(700px) rotateX(55deg);
      transform-origin: 50% 100%;
      mask-image: linear-gradient(0deg, #000 0%, transparent 60%);
    }

    .login-scanlines {
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px);
      pointer-events: none;
    }

    .login-cat {
      position: absolute;
      bottom: 0; right: 5%;
      width: 160px;
      opacity: 0.75;
      filter: drop-shadow(0 0 16px rgba(255,46,147,0.4));
    }

    .login-box {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      text-align: center;
    }

    .login-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--magenta);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .login-eyebrow::before, .login-eyebrow::after {
      content: "";
      width: 20px; height: 1px;
      background: var(--magenta);
      box-shadow: 0 0 8px var(--magenta);
    }

    .login-title {
      font-family: var(--display);
      font-weight: 900;
      font-size: clamp(56px, 16vw, 90px);
      line-height: 0.88;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #fff 0%, #fff 38%, var(--magenta) 38%, var(--magenta) 70%, var(--orange) 70%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .login-sub {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--bone-mute);
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .login-form-card {
      background: rgba(22,8,51,0.85);
      border: 1px solid rgba(255,46,147,0.25);
      border-radius: var(--r-card);
      padding: 1.75rem;
      backdrop-filter: blur(16px);
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .lg-input {
      flex: 1;
      padding: 0.65rem 0.9rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--bone);
      outline: none;
      transition: all 0.2s;
    }
    .lg-input:focus {
      border-color: rgba(255,46,147,0.6);
      background: rgba(255,46,147,0.06);
      box-shadow: 0 0 0 3px rgba(255,46,147,0.1);
    }
    .lg-input::placeholder { color: var(--bone-mute); }

    .error-msg {
      color: var(--magenta);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      margin-top: 0.75rem;
    }
    .error-msg::before { content: "// "; }

    /* ===================== BUTTONS ===================== */
    .btn {
      padding: 0.6rem 1.1rem;
      background: linear-gradient(135deg, var(--magenta), var(--violet));
      color: white;
      border: none;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(255,46,147,0.25);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255,46,147,0.35); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn.danger {
      background: transparent;
      border: 1px solid rgba(255,46,147,0.4);
      color: var(--magenta);
      box-shadow: none;
    }
    .btn.danger:hover { background: rgba(255,46,147,0.1); box-shadow: none; }

    .btn.saved {
      background: linear-gradient(135deg, var(--lime), #8bc700);
      color: var(--void);
      box-shadow: 0 4px 14px rgba(200,255,0,0.25);
    }

    /* ===================== APP HEADER ===================== */
    .app-header {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #160833 0%, #0d0420 100%);
      border-bottom: 1px solid rgba(255,46,147,0.2);
      padding: 1rem 1.25rem 0;
    }
    .app-header-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--grid-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-soft) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.5;
    }
    .app-header-inner { position: relative; z-index: 1; }
    .app-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .app-wordmark {
      font-family: var(--display);
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #fff, var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .admin-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--magenta);
      background: rgba(255,46,147,0.1);
      border: 1px solid rgba(255,46,147,0.3);
      border-radius: var(--r-pill);
      padding: 3px 10px;
    }

    nav { display: flex; }
    .tab-btn {
      flex: 1;
      padding: 0.7rem 1rem;
      border: none;
      background: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--bone-mute);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--magenta);
      border-bottom-color: var(--magenta);
    }

    /* ===================== MAIN ===================== */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.25rem;
      padding-bottom: 120px; /* space for corner cat */
    }

    /* ===================== CARDS ===================== */
    .card {
      background: linear-gradient(135deg, #160833 0%, #0d0420 100%);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--r-card);
      padding: 1.25rem;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .card-title::before {
      content: "";
      width: 16px; height: 1px;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--bone-mute);
      margin: 1.5rem 0 0.6rem;
    }
    .section-label:first-child { margin-top: 0; }

    .add-form { display: flex; gap: 0.5rem; }

    /* ===================== DEELNEMERS ===================== */
    .deelnemer-row {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #160833 0%, #0d0420 100%);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--r-card);
      padding: 1rem 1.25rem;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }
    .deelnemer-row:hover { border-color: rgba(255,46,147,0.25); }

    .deelnemer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .deelnemer-info { display: flex; align-items: center; gap: 10px; }

    .deelnemer-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1f0a47, #160833);
      border: 1px solid rgba(255,46,147,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--magenta);
      flex-shrink: 0;
    }

    .deelnemer-naam { font-weight: 600; font-size: 15px; }

    .link-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .link-box:hover { border-color: rgba(0,240,255,0.3); background: rgba(0,240,255,0.04); }

    .link-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--bone-mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy-hint {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan);
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    /* Peek cat inside deelnemer row */
    .cat-peek {
      position: absolute;
      bottom: -2px; right: 10px;
      width: 46px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .deelnemer-row:hover .cat-peek {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===================== MATCH CARDS ===================== */
    .match-card {
      position: relative;
      background: linear-gradient(135deg, #160833 0%, #0d0420 100%);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--r-card);
      padding: 1rem 1.25rem;
      margin-bottom: 0.5rem;
    }

    .match-card-accent {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--violet), var(--magenta));
      border-radius: 3px 0 0 3px;
      transition: background 0.3s;
    }
    .match-card-accent.has-score {
      background: linear-gradient(180deg, var(--lime), var(--cyan));
    }

    .match-teams {
      font-family: var(--display);
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
    }

    .match-date {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bone-mute);
      margin-bottom: 0.75rem;
    }

    .score-form { display: flex; align-items: center; gap: 0.5rem; }

    .score-input {
      width: 52px; height: 44px;
      text-align: center;
      font-family: var(--mono);
      font-size: 1.2rem;
      font-weight: 800;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: var(--bone);
      outline: none;
      transition: all 0.2s;
      -moz-appearance: textfield;
    }
    .score-input::-webkit-inner-spin-button,
    .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-input:focus {
      border-color: rgba(0,240,255,0.5);
      background: rgba(0,240,255,0.06);
      box-shadow: 0 0 0 3px rgba(0,240,255,0.1);
    }

    .score-sep { font-family: var(--mono); font-size: 1rem; color: var(--bone-mute); }

    /* ===================== EMPTY STATE ===================== */
    .empty-state {
      text-align: center;
      color: var(--bone-mute);
      padding: 1rem;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .empty-state::before { content: "// "; color: var(--cyan); }

    /* ===================== CATS ===================== */
    .cat-corner {
      position: fixed;
      bottom: 0; right: 16px;
      width: 88px;
      z-index: 100;
      pointer-events: none;
      filter: drop-shadow(0 0 14px rgba(255,46,147,0.45));
      animation: cat-bob 3.5s ease-in-out infinite;
    }
    @keyframes cat-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .empty-cat {
      display: block;
      margin: 1.5rem auto 0.5rem;
      width: 72px;
      opacity: 0.55;
      filter: drop-shadow(0 0 10px rgba(0,240,255,0.3));
    }

    @media (max-width: 480px) {
      main { padding: 1rem; padding-bottom: 100px; }
      .cat-corner { width: 64px; right: 8px; }
    }
  </style>
</head>

<script type="module">
  import { supabase } from './supabase.js'

  const WACHTWOORD = 'afblijven'
  const BASE_URL = window.location.origin + window.location.pathname.replace('admin.html', '')

  // ── Login ─────────────────────────────────────────────
  document.getElementById('login-btn').addEventListener('click', checkWachtwoord)
  document.getElementById('wachtwoord-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkWachtwoord()
  })

  function checkWachtwoord() {
    const input = document.getElementById('wachtwoord-input')
    if (input.value === WACHTWOORD) {
      sessionStorage.setItem('admin_auth', '1')
      toonAdmin()
    } else {
      document.getElementById('login-error').classList.remove('hidden')
      input.style.borderColor = 'var(--magenta)'
      setTimeout(() => { input.style.borderColor = '' }, 1500)
    }
  }

  function toonAdmin() {
    document.getElementById('login-section').classList.add('hidden')
    document.getElementById('admin-section').classList.remove('hidden')
    toonTab('deelnemers')
  }

  if (sessionStorage.getItem('admin_auth') === '1') toonAdmin()

  // ── Tabs ──────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => toonTab(btn.dataset.tab))
  })

  function toonTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'))
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'))
    document.getElementById(`tab-${tab}`).classList.remove('hidden')
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active')
    if (tab === 'deelnemers') laadDeelnemers()
    if (tab === 'uitslagen') laadUitslagen()
  }

  // ── Helpers ───────────────────────────────────────────
  function initialen(naam) {
    const parts = (naam || '??').trim().split(' ')
    return parts.length >= 2
      ? (parts[0][0] + parts[1][0]).toUpperCase()
      : (naam || '??').slice(0, 2).toUpperCase()
  }

  function katPeekSvg() {
    return `<svg class="cat-peek" viewBox="0 0 60 52" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="30" cy="34" rx="22" ry="16" fill="#160833" stroke="#ff2e93" stroke-width="1.5"/>
      <ellipse cx="30" cy="20" rx="18" ry="16" fill="#160833" stroke="#ff2e93" stroke-width="1.5"/>
      <polygon points="14,12 8,0 22,10" fill="#160833" stroke="#ff2e93" stroke-width="1.5"/>
      <polygon points="46,12 52,0 38,10" fill="#160833" stroke="#ff2e93" stroke-width="1.5"/>
      <ellipse cx="22" cy="19" rx="5" ry="6" fill="#00f0ff" opacity="0.9"/>
      <ellipse cx="38" cy="19" rx="5" ry="6" fill="#00f0ff" opacity="0.9"/>
      <ellipse cx="22" cy="20" rx="2.5" ry="4" fill="#07010f"/>
      <ellipse cx="38" cy="20" rx="2.5" ry="4" fill="#07010f"/>
      <polygon points="30,26 27,30 33,30" fill="#ff2e93"/>
      <line x1="6" y1="22" x2="22" y2="22" stroke="#b53dff" stroke-width="1" opacity="0.6"/>
      <line x1="54" y1="22" x2="38" y2="22" stroke="#b53dff" stroke-width="1" opacity="0.6"/>
    </svg>`
  }

  function katLeegSvg() {
    return `<svg class="empty-cat" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="68" rx="34" ry="28" fill="#160833" stroke="#00f0ff" stroke-width="1.5"/>
      <ellipse cx="50" cy="40" rx="26" ry="24" fill="#160833" stroke="#00f0ff" stroke-width="1.5"/>
      <polygon points="28,26 18,4 38,22" fill="#160833" stroke="#00f0ff" stroke-width="1.5"/>
      <polygon points="72,26 82,4 62,22" fill="#160833" stroke="#00f0ff" stroke-width="1.5"/>
      <line x1="34" y1="40" x2="46" y2="40" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="54" y1="40" x2="66" y2="40" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="50,50 46,55 54,55" fill="#ff2e93"/>
      <path d="M46,55 Q50,59 54,55" fill="none" stroke="#ff2e93" stroke-width="1.2"/>
      <path d="M22,62 Q50,78 78,62" fill="none" stroke="#c8ff00" stroke-width="2" stroke-linecap="round"/>
      <circle cx="50" cy="68" r="3" fill="#c8ff00"/>
    </svg>`
  }

  // ── Deelnemers ────────────────────────────────────────
  async function laadDeelnemers() {
    const { data } = await supabase.from('participants').select('*').order('name')
    const lijst = document.getElementById('deelnemers-lijst')
    lijst.innerHTML = ''
    if (!data || data.length === 0) {
      lijst.innerHTML = `${katLeegSvg()}<p class="empty-state">Nog geen deelnemers</p>`
      return
    }
    data.forEach(d => lijst.appendChild(maakDeelnemerRij(d)))
  }

  function maakDeelnemerRij(deelnemer) {
    const link = `${BASE_URL}?token=${deelnemer.token}`
    const row = document.createElement('div')
    row.className = 'deelnemer-row'
    row.id = `rij-${deelnemer.id}`
    row.innerHTML = `
      <div class="deelnemer-top">
        <div class="deelnemer-info">
          <div class="deelnemer-avatar">${initialen(deelnemer.name)}</div>
          <span class="deelnemer-naam">${deelnemer.name}</span>
        </div>
        <button class="btn danger verwijder-btn" style="padding:0.35rem 0.75rem;font-size:10px;">Verwijder</button>
      </div>
      <div class="link-box">
        <span class="link-url">${link}</span>
        <span class="copy-hint">Kopieer</span>
      </div>
      ${katPeekSvg()}
    `
    row.querySelector('.link-box').addEventListener('click', () => kopieerLink(link, row))
    row.querySelector('.verwijder-btn').addEventListener('click', () => verwijder(deelnemer.id))
    return row
  }

  async function kopieerLink(link, row) {
    await navigator.clipboard.writeText(link)
    const hint = row.querySelector('.copy-hint')
    hint.textContent = '✓ Gekopieerd'
    hint.style.color = 'var(--lime)'
    setTimeout(() => { hint.textContent = 'Kopieer'; hint.style.color = '' }, 1500)
  }

  document.getElementById('toevoegen-btn').addEventListener('click', voegToe)
  document.getElementById('naam-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') voegToe()
  })

  async function voegToe() {
    const naam = document.getElementById('naam-input').value.trim()
    if (!naam) return
    const token = naam.toLowerCase().replace(/\s+/g, '-') + '-' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36)
    const { data, error } = await supabase.from('participants').insert({ name: naam, token }).select().single()
    if (error) { alert('Fout: ' + error.message); return }
    document.getElementById('naam-input').value = ''
    document.getElementById('deelnemers-lijst').prepend(maakDeelnemerRij(data))
  }

  async function verwijder(id) {
    if (!confirm('Deelnemer verwijderen?')) return
    await supabase.from('participants').delete().eq('id', id)
    document.getElementById(`rij-${id}`)?.remove()
  }

  // ── Uitslagen ─────────────────────────────────────────
  async function laadUitslagen() {
    const { data: matches } = await supabase.from('matches').select('*').order('date')
    const container = document.getElementById('uitslagen-lijst')
    container.innerHTML = ''

    if (!matches || matches.length === 0) {
      container.innerHTML = `${katLeegSvg()}<p class="empty-state">Nog geen wedstrijden</p>`
      return
    }

    const groepen = [...new Set(matches.map(m => m.poule).filter(Boolean))].sort()

    groepen.forEach(poule => {
      const header = document.createElement('div')
      header.className = 'section-label'
      header.textContent = `// Groep ${poule}`
      container.appendChild(header)
      matches.filter(m => m.poule === poule).forEach(match => {
        container.appendChild(maakUitslagKaart(match))
      })
    })

    const zonderPoule = matches.filter(m => !m.poule)
    if (zonderPoule.length > 0) {
      const header = document.createElement('div')
      header.className = 'section-label'
      header.textContent = '// Overig'
      container.appendChild(header)
      zonderPoule.forEach(match => container.appendChild(maakUitslagKaart(match)))
    }
  }

  function maakUitslagKaart(match) {
    const card = document.createElement('div')
    card.className = 'match-card'
    const heeftUitslag = match.score_home !== null && match.score_away !== null

    const accent = document.createElement('div')
    accent.className = `match-card-accent${heeftUitslag ? ' has-score' : ''}`
    card.appendChild(accent)

    const inner = document.createElement('div')
    inner.innerHTML = `
      <div class="match-teams">${match.home} × ${match.away}</div>
      ${match.date ? `<div class="match-date">${formatDate(match.date)}</div>` : ''}
      <div class="score-form">
        <input type="number" min="0" max="20" class="score-input" id="home-${match.id}" value="${match.score_home ?? ''}">
        <span class="score-sep">—</span>
        <input type="number" min="0" max="20" class="score-input" id="away-${match.id}" value="${match.score_away ?? ''}">
        <button class="btn opslaan-btn" style="margin-left:auto;">Opslaan</button>
        ${heeftUitslag ? `<button class="btn danger verwijder-btn">Wis</button>` : ''}
      </div>
    `
    card.appendChild(inner)

    card.querySelector('.opslaan-btn').addEventListener('click', () => slaUitslagOp(match.id, card, accent))
    card.querySelector('.verwijder-btn')?.addEventListener('click', () => wisUitslag(match.id, card, accent))
    return card
  }

  async function wisUitslag(matchId, card, accent) {
    if (!confirm('Uitslag verwijderen?')) return
    const { error } = await supabase.from('matches').update({ score_home: null, score_away: null }).eq('id', matchId)
    if (error) { alert('Fout: ' + error.message); return }
    document.getElementById(`home-${matchId}`).value = ''
    document.getElementById(`away-${matchId}`).value = ''
    accent.classList.remove('has-score')
    card.querySelector('.verwijder-btn')?.remove()
  }

  async function slaUitslagOp(matchId, card, accent) {
    const homeVal = document.getElementById(`home-${matchId}`).value
    const awayVal = document.getElementById(`away-${matchId}`).value
    const btn = card.querySelector('.opslaan-btn')

    if (homeVal === '' || awayVal === '') {
      const h = document.getElementById(`home-${matchId}`)
      const a = document.getElementById(`away-${matchId}`)
      h.style.borderColor = 'var(--magenta)'
      a.style.borderColor = 'var(--magenta)'
      setTimeout(() => { h.style.borderColor = ''; a.style.borderColor = '' }, 1500)
      return
    }

    btn.textContent = '...'
    btn.disabled = true

    const { error } = await supabase.from('matches').update({
      score_home: parseInt(homeVal),
      score_away: parseInt(awayVal)
    }).eq('id', matchId)

    if (error) {
      alert('Fout: ' + error.message)
      btn.textContent = 'Opslaan'
      btn.disabled = false
    } else {
      btn.textContent = '✓ Opgeslagen'
      btn.classList.add('saved')
      accent.classList.add('has-score')
      if (!card.querySelector('.verwijder-btn')) {
        const wisBtn = document.createElement('button')
        wisBtn.className = 'btn danger verwijder-btn'
        wisBtn.textContent = 'Wis'
        wisBtn.addEventListener('click', () => wisUitslag(matchId, card, accent))
        card.querySelector('.score-form').appendChild(wisBtn)
      }
      setTimeout(() => {
        btn.textContent = 'Opslaan'
        btn.classList.remove('saved')
        btn.disabled = false
      }, 2000)
    }
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('nl-NL', {
      weekday: 'short', day: 'numeric', month: 'short',
      hour: '2-digit', minute: '2-digit'
    })
  }
</script>
</body>
</html>
