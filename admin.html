<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WK Pool 2026 — Admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #111118;
      --bg2:      #1a1a24;
      --bg3:      #22222e;
      --card:     #1e1e2a;
      --pink:     #ff4d6d;
      --teal:     #00d4aa;
      --red:      #ff4d6d;
      --purple-l: #b48af5;
      --text:     rgba(255,255,255,0.92);
      --text-mid: rgba(255,255,255,0.55);
      --text-dim: rgba(255,255,255,0.28);
      --border:   rgba(255,255,255,0.07);
      --font:     'Poppins', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(124,92,191,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(255,77,109,0.06) 0%, transparent 55%);
    }

    .hidden { display: none !important; }

    /* ── LOGIN ── */
    #login-section {
      position: relative; z-index: 5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      max-width: 380px; width: 100%;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    .login-logo  { font-size: 40px; margin-bottom: 0.75rem; line-height: 1; }
    .login-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--pink); margin-bottom: 0.4rem;
    }
    .login-title { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 1.25rem; }

    .input-group {
      display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem;
    }

    .input-group .btn-primary { width: 100%; justify-content: center; }

    .dark-input {
      flex: 1; padding: 0.6rem 0.9rem;
      background: var(--bg3);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      font-family: var(--font); font-size: 15px;
      color: var(--text); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .dark-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255,77,109,0.18);
    }

    .dark-input::placeholder { color: var(--text-dim); }

    .btn-primary {
      padding: 0.6rem 1.1rem;
      background: linear-gradient(135deg, #ff6b8a, #ff4d6d);
      color: white; border: none; border-radius: 10px;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: opacity .15s;
      box-shadow: 0 8px 20px rgba(255,77,109,0.3);
    }

    .btn-primary:hover    { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary.saved    { background: var(--teal); box-shadow: 0 8px 20px rgba(0,212,170,0.25); }

    .error-msg { font-size: 13px; color: var(--red); margin-top: 0.5rem; }

    /* ── TOP HEADER ── */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(26,26,36,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem;
      height: 52px;
      display: flex; align-items: center; gap: 0.6rem;
    }

    .nav-brand { font-weight: 800; font-size: 17px; letter-spacing: -0.03em; }

    .admin-badge {
      font-size: 11px; font-weight: 700;
      color: #ffb800;
      background: rgba(255,184,0,0.12);
      border: 1px solid rgba(255,184,0,0.25);
      border-radius: 99px; padding: 2px 10px;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: 72px;
      background: rgba(26,26,36,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 16px 10px;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; padding: 0 16px; background: none; border: none;
      font-family: var(--font);
    }

    .nav-icon  { font-size: 20px; color: var(--text-dim); transition: color .15s; }
    .nav-label { font-size: 9px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }

    .nav-item.active .nav-icon  { color: var(--pink); filter: drop-shadow(0 0 6px rgba(255,77,109,0.5)); }
    .nav-item.active .nav-label { color: var(--pink); }

    /* ── MAIN ── */
    main {
      max-width: 720px; margin: 0 auto;
      padding: 1.5rem 1.25rem 6rem;
      position: relative; z-index: 5;
    }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 1.25rem; margin-bottom: 1rem;
    }

    .card-title {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 0.85rem;
    }

    .section-label {
      font-size: 11px; font-weight: 700; color: var(--text-dim);
      letter-spacing: .08em; text-transform: uppercase;
      margin: 1.5rem 0 0.6rem;
    }

    /* ── PARTICIPANT ROWS ── */
    .deelnemer-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 0.9rem 1.1rem; margin-bottom: 0.5rem;
    }

    .deelnemer-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem;
    }

    .deelnemer-info { display: flex; align-items: center; gap: 10px; }

    .deelnemer-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0; overflow: hidden;
    }

    .deelnemer-naam { font-size: 15px; font-weight: 600; }

    .btn-destructive {
      padding: 0.3rem 0.75rem;
      background: none; color: var(--red);
      border: 1px solid rgba(255,77,109,0.25);
      border-radius: 8px; font-family: var(--font); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }

    .btn-destructive:hover { background: rgba(255,77,109,0.08); }

    .link-box {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.45rem 0.75rem;
      cursor: pointer; transition: border-color .15s;
    }

    .link-box:hover { border-color: rgba(180,138,245,0.4); }

    .link-url {
      font-family: ui-monospace, monospace; font-size: 12px;
      color: var(--text-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .copy-hint { font-size: 13px; font-weight: 600; color: var(--purple-l); white-space: nowrap; flex-shrink: 0; }

    /* ── MATCH CARDS (admin) ── */
    .match-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 0.5rem;
    }

    .match-card.has-score { border-color: rgba(0,212,170,0.3); }

    .match-teams { font-size: 16px; font-weight: 600; margin-bottom: 0.2rem; }
    .match-date  { font-size: 12px; color: var(--text-dim); margin-bottom: 0.75rem; }

    .score-form { display: flex; align-items: center; gap: 0.5rem; }

    .score-input {
      width: 52px; height: 40px; text-align: center;
      font-family: var(--font); font-size: 17px; font-weight: 700;
      background: var(--bg3); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: var(--text); outline: none;
      transition: border-color .15s, box-shadow .15s;
      -moz-appearance: textfield;
    }

    .score-input::-webkit-inner-spin-button,
    .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    .score-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255,77,109,0.18);
    }

    .score-sep { font-size: 15px; color: var(--text-dim); }

    .btn-secondary {
      padding: 0.4rem 0.85rem; background: none; color: var(--red);
      border: 1px solid rgba(255,77,109,0.25); border-radius: 8px;
      font-family: var(--font); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }

    .btn-secondary:hover { background: rgba(255,77,109,0.08); }

    .empty-state {
      text-align: center; color: var(--text-dim);
      padding: 2rem 1rem; font-size: 14px;
    }

    /* ── VOORSPELLINGEN ── */
    .pred-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 0.9rem 1.1rem; margin-bottom: 0.5rem;
    }

    .pred-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem;
    }

    .pred-count { font-size: 14px; font-weight: 700; }

    .pred-bar-bg {
      height: 5px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden;
    }

    .pred-bar-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease; }

    @media (max-width: 480px) {
      .nav-brand { font-size: 15px; }
      main { padding: 1rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-section">
  <div class="login-card">
    <div class="login-logo">⚽</div>
    <div class="login-eyebrow">WK Pool 2026</div>
    <div class="login-title">Beheerder</div>
    <div class="input-group">
      <input type="password" class="dark-input" id="wachtwoord-input" placeholder="Wachtwoord" />
      <button class="btn-primary" id="login-btn">Inloggen</button>
    </div>
    <p class="error-msg hidden" id="login-error">Onjuist wachtwoord</p>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-section" class="hidden">
  <header class="app-header">
    <div class="nav-brand">WK Pool 2026</div>
    <span class="admin-badge">Admin</span>
  </header>

  <nav class="bottom-nav">
    <button class="nav-item" data-tab="deelnemers">
      <div class="nav-icon">👥</div>
      <div class="nav-label">Deelnemers</div>
    </button>
    <button class="nav-item active" data-tab="uitslagen">
      <div class="nav-icon">⚽</div>
      <div class="nav-label">Uitslagen</div>
    </button>
    <button class="nav-item" data-tab="voorspellingen">
      <div class="nav-icon">📊</div>
      <div class="nav-label">Voorspellingen</div>
    </button>
  </nav>

  <main>
    <!-- Deelnemers -->
    <div id="tab-deelnemers" class="tab-content">
      <div class="card" style="margin-top:0.5rem">
        <div class="card-title">Nieuwe deelnemer</div>
        <div class="input-group" style="margin-bottom:0">
          <input type="text" class="dark-input" id="naam-input" placeholder="Naam" />
          <button class="btn-primary" id="toevoegen-btn">Voeg toe</button>
        </div>
      </div>
      <div class="section-label">Deelnemers</div>
      <div id="deelnemers-lijst"></div>
    </div>

    <!-- Uitslagen -->
    <div id="tab-uitslagen" class="tab-content hidden">
      <div class="card" style="margin-top:0.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem">
        <div>
          <div style="font-size:14px;font-weight:600">Uitslagen ophalen</div>
          <div style="font-size:12px;color:var(--text-mid);margin-top:2px" id="sync-status">Haalt automatisch op elke 15 min</div>
        </div>
        <button class="btn-primary" id="sync-btn" style="white-space:nowrap;flex-shrink:0">⟳ Sync nu</button>
      </div>
      <div id="uitslagen-lijst"></div>
    </div>

    <!-- Voorspellingen -->
    <div id="tab-voorspellingen" class="tab-content hidden"></div>
  </main>
</div>

<script>
  const WACHTWOORD = 'afblijven'

  document.getElementById('login-btn').addEventListener('click', checkWachtwoord)
  document.getElementById('wachtwoord-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkWachtwoord()
  })

  function checkWachtwoord() {
    const input = document.getElementById('wachtwoord-input')
    if (input.value === WACHTWOORD) {
      sessionStorage.setItem('admin_auth', '1')
      document.dispatchEvent(new CustomEvent('admin-login'))
    } else {
      document.getElementById('login-error').classList.remove('hidden')
      input.style.borderColor = 'var(--red)'
      setTimeout(() => { input.style.borderColor = '' }, 1500)
    }
  }
</script>

<script type="module">
  import { supabase, SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase.js'

  const BASE_URL = window.location.origin + window.location.pathname.replace('admin.html', '')

  function toonAdmin() {
    document.getElementById('login-section').classList.add('hidden')
    document.getElementById('admin-section').classList.remove('hidden')
    toonTab('uitslagen')
  }

  document.addEventListener('admin-login', toonAdmin)
  if (sessionStorage.getItem('admin_auth') === '1') toonAdmin()

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => toonTab(btn.dataset.tab))
  })

  function toonTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'))
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'))
    document.getElementById(`tab-${tab}`).classList.remove('hidden')
    document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active')
    if (tab === 'deelnemers')     laadDeelnemers()
    if (tab === 'uitslagen')      laadUitslagen()
    if (tab === 'voorspellingen') laadVoorspellingen()
  }

  function initialen(naam) {
    const parts = (naam || '??').trim().split(' ')
    return parts.length >= 2
      ? (parts[0][0] + parts[1][0]).toUpperCase()
      : (naam || '??').slice(0, 2).toUpperCase()
  }

  const SHIRT_DESIGNS = [
    { type: 'solid',    c1: '#e63950', c2: '#ffffff', collar: '#a8001e' },
    { type: 'hstripes', c1: '#0369a1', c2: '#ffffff', collar: '#075985' },
    { type: 'vstripes', c1: '#1c1c24', c2: '#ffffff', collar: '#333' },
    { type: 'sash',     c1: '#22c55e', c2: '#ffffff', collar: '#15803d' },
    { type: 'half',     c1: '#9b6de8', c2: '#f97316', collar: '#6a3bc4' },
    { type: 'solid',    c1: '#f59e0b', c2: '#b45309', collar: '#92400e' },
    { type: 'hstripes', c1: '#e84393', c2: '#ffffff', collar: '#9d1c5e' },
    { type: 'panel',    c1: '#38bdf8', c2: '#0369a1', collar: '#075985' },
    { type: 'vstripes', c1: '#e63950', c2: '#1c1c24', collar: '#a8001e' },
    { type: 'sash',     c1: '#1c1c24', c2: '#f59e0b', collar: '#92400e' },
    { type: 'hoops',    c1: '#e63950', c2: '#ffffff', collar: '#a8001e' },
    { type: 'panel',    c1: '#a78bfa', c2: '#4338ca', collar: '#3730a3' },
    { type: 'chevron',  c1: '#0ea5e9', c2: '#ffffff', collar: '#0369a1' },
    { type: 'hoops',    c1: '#f97316', c2: '#1c1c24', collar: '#c2410c' },
    { type: 'chevron',  c1: '#22c55e', c2: '#f59e0b', collar: '#15803d' },
    { type: 'half',     c1: '#14b8a6', c2: '#6366f1', collar: '#0f766e' },
  ]

  function strHash(s) {
    let h = 0
    for (const c of String(s || '')) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff
    return Math.abs(h)
  }

  function shirtPattern(type, c1, c2) {
    switch (type) {
      case 'solid':    return `<rect width="100" height="100" fill="${c1}"/>`
      case 'hstripes': return `<rect width="100" height="100" fill="${c1}"/><rect width="100" y="20" height="15" fill="${c2}"/><rect width="100" y="50" height="15" fill="${c2}"/><rect width="100" y="80" height="15" fill="${c2}"/>`
      case 'vstripes': return `<rect width="100" height="100" fill="${c1}"/><rect x="18" width="11" height="100" fill="${c2}"/><rect x="40" width="11" height="100" fill="${c2}"/><rect x="62" width="11" height="100" fill="${c2}"/><rect x="84" width="11" height="100" fill="${c2}"/>`
      case 'sash':     return `<rect width="100" height="100" fill="${c1}"/><polygon points="22,0 62,0 78,100 38,100" fill="${c2}"/>`
      case 'half':     return `<rect width="50" height="100" fill="${c1}"/><rect x="50" width="50" height="100" fill="${c2}"/>`
      case 'panel':    return `<rect width="100" height="100" fill="${c2}"/><rect x="27" width="46" height="100" fill="${c1}"/>`
      case 'hoops':    return `<rect width="100" height="100" fill="${c1}"/><rect width="100" y="28" height="16" fill="${c2}"/><rect width="100" y="60" height="16" fill="${c2}"/>`
      case 'chevron':  return `<rect width="100" height="100" fill="${c1}"/><polygon points="0,48 50,68 100,48 100,62 50,82 0,62" fill="${c2}"/>`
      default:         return `<rect width="100" height="100" fill="${c1}"/>`
    }
  }

  function shirtSvg(naam) {
    const ini = initialen(naam)
    const design = SHIRT_DESIGNS[strHash(naam) % SHIRT_DESIGNS.length]
    const clipId = 'sc' + strHash(naam)
    const shirtPath = 'M35,12 L10,24 L16,42 L28,36 L28,88 L72,88 L72,36 L84,42 L90,24 L65,12 Q50,22 35,12 Z'
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
      <rect width="100" height="100" rx="50" fill="#1a1a28"/>
      <defs><clipPath id="${clipId}"><path d="${shirtPath}"/></clipPath></defs>
      <g clip-path="url(#${clipId})">${shirtPattern(design.type, design.c1, design.c2)}</g>
      <path d="M35,12 Q50,22 65,12 L57,27 Q50,33 43,27 Z" fill="${design.collar}"/>
      <text x="50" y="67" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="20" fill="white" stroke="rgba(0,0,0,0.5)" stroke-width="3" paint-order="stroke">${ini}</text>
    </svg>`
  }

  // ── Deelnemers ──────────────────────────────────────────

  async function laadDeelnemers() {
    const { data } = await supabase.from('participants').select('*').order('name')
    const lijst = document.getElementById('deelnemers-lijst')
    lijst.innerHTML = ''
    const zichtbaar = (data || []).filter(d => d.id !== 22)
    if (zichtbaar.length === 0) {
      lijst.innerHTML = '<p class="empty-state">Nog geen deelnemers toegevoegd</p>'
      return
    }
    zichtbaar.forEach(d => lijst.appendChild(maakDeelnemerRij(d)))
  }

  function maakDeelnemerRij(deelnemer) {
    const link = `${BASE_URL}?token=${deelnemer.token}`
    const row = document.createElement('div')
    row.className = 'deelnemer-row'
    row.id = `rij-${deelnemer.id}`
    row.innerHTML = `
      <div class="deelnemer-top">
        <div class="deelnemer-info">
          <div class="deelnemer-avatar" style="background:none;padding:0;overflow:hidden">${shirtSvg(deelnemer.name)}</div>
          <span class="deelnemer-naam">${deelnemer.name}</span>
        </div>
        <button class="btn-destructive verwijder-btn">Verwijder</button>
      </div>
      <div class="link-box">
        <span class="link-url">${link}</span>
        <span class="copy-hint">Kopieer</span>
      </div>
    `
    row.querySelector('.link-box').addEventListener('click', () => kopieerLink(link, row))
    row.querySelector('.verwijder-btn').addEventListener('click', () => verwijder(deelnemer.id))
    return row
  }

  async function kopieerLink(link, row) {
    await navigator.clipboard.writeText(link)
    const hint = row.querySelector('.copy-hint')
    hint.textContent = '✓ Gekopieerd'
    hint.style.color = 'var(--teal)'
    setTimeout(() => { hint.textContent = 'Kopieer'; hint.style.color = '' }, 1500)
  }

  document.getElementById('toevoegen-btn').addEventListener('click', voegToe)
  document.getElementById('naam-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') voegToe()
  })

  async function voegToe() {
    const naam = document.getElementById('naam-input').value.trim()
    if (!naam) return
    const token = naam.toLowerCase().replace(/\s+/g, '-') + '-' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36)
    const { data, error } = await supabase.from('participants').insert({ name: naam, token }).select().single()
    if (error) { alert('Fout: ' + error.message); return }
    document.getElementById('naam-input').value = ''
    document.getElementById('deelnemers-lijst').prepend(maakDeelnemerRij(data))
  }

  async function verwijder(id) {
    if (!confirm('Deelnemer verwijderen?')) return
    await supabase.from('participants').delete().eq('id', id)
    document.getElementById(`rij-${id}`)?.remove()
  }

  // ── Uitslagen ────────────────────────────────────────────

  async function laadUitslagen() {
    const { data: matches } = await supabase.from('matches').select('*').order('date')
    const container = document.getElementById('uitslagen-lijst')
    container.innerHTML = ''

    if (!matches || matches.length === 0) {
      container.innerHTML = '<p class="empty-state">Nog geen wedstrijden</p>'
      return
    }

    const groepen = [...new Set(matches.map(m => m.poule).filter(Boolean))].sort()

    groepen.forEach(poule => {
      const header = document.createElement('div')
      header.className = 'section-label'
      header.textContent = `Groep ${poule}`
      container.appendChild(header)
      matches.filter(m => m.poule === poule).forEach(match => {
        container.appendChild(maakUitslagKaart(match))
      })
    })

    const FASE_VOLGORDE = ['zestiende finale', 'achtste finale', 'kwartfinale', 'halve finale', 'kleine finale', 'finale']
    const knockout = matches.filter(m => !m.poule && m.phase)
    FASE_VOLGORDE.forEach(fase => {
      const faseMatches = knockout.filter(m => m.phase === fase)
      if (!faseMatches.length) return
      const header = document.createElement('div')
      header.className = 'section-label'
      header.textContent = fase.charAt(0).toUpperCase() + fase.slice(1)
      container.appendChild(header)
      faseMatches.forEach(match => container.appendChild(maakUitslagKaart(match)))
    })
  }

  function maakUitslagKaart(match) {
    const card = document.createElement('div')
    const heeftUitslag = match.score_home !== null && match.score_away !== null
    const isKnockout = !match.poule && match.phase
    card.className = `match-card${heeftUitslag ? ' has-score' : ''}`

    const teamNamenHtml = isKnockout ? `
      <div class="team-naam-form" style="display:flex;gap:0.5rem;margin-bottom:0.5rem;align-items:center">
        <input type="text" class="score-input team-home-input" id="team-home-${match.id}" value="${match.home ?? ''}" placeholder="Thuis" style="flex:1;width:auto">
        <span style="color:var(--text-dim);font-size:13px">×</span>
        <input type="text" class="score-input team-away-input" id="team-away-${match.id}" value="${match.away ?? ''}" placeholder="Uit" style="flex:1;width:auto">
        <button class="btn-secondary team-save-btn" style="padding:0.4rem 0.7rem;font-size:13px">💾</button>
      </div>
    ` : `<div class="match-teams">${match.home} × ${match.away}</div>`

    card.innerHTML = `
      ${teamNamenHtml}
      ${match.date ? `<div class="match-date">${formatDate(match.date)}</div>` : ''}
      <div class="score-form">
        <input type="number" min="0" max="20" class="score-input" id="home-${match.id}" value="${match.score_home ?? ''}">
        <span class="score-sep">–</span>
        <input type="number" min="0" max="20" class="score-input" id="away-${match.id}" value="${match.score_away ?? ''}">
        <button class="btn-primary opslaan-btn" style="margin-left:auto;padding:0.4rem 0.9rem;font-size:14px">Opslaan</button>
        ${heeftUitslag ? `<button class="btn-secondary wis-btn">Wis</button>` : ''}
      </div>
    `

    card.querySelector('.opslaan-btn').addEventListener('click', () => slaUitslagOp(match.id, card))
    card.querySelector('.wis-btn')?.addEventListener('click', () => wisUitslag(match.id, card))
    if (isKnockout) {
      card.querySelector('.team-save-btn').addEventListener('click', () => slaTeamnamenOp(match.id, card))
    }
    return card
  }

  async function slaTeamnamenOp(matchId, card) {
    const homeInput = document.getElementById(`team-home-${matchId}`)
    const awayInput = document.getElementById(`team-away-${matchId}`)
    const btn = card.querySelector('.team-save-btn')
    const homeVal = homeInput.value.trim()
    const awayVal = awayInput.value.trim()
    if (!homeVal || !awayVal) { homeInput.style.borderColor = 'var(--red)'; awayInput.style.borderColor = 'var(--red)'; setTimeout(() => { homeInput.style.borderColor = ''; awayInput.style.borderColor = '' }, 1500); return }
    btn.textContent = '…'
    btn.disabled = true
    const { error } = await supabase.from('matches').update({ home: homeVal, away: awayVal }).eq('id', matchId)
    if (error) { alert('Fout: ' + error.message); btn.textContent = '💾'; btn.disabled = false }
    else { btn.textContent = '✓'; setTimeout(() => { btn.textContent = '💾'; btn.disabled = false }, 1500) }
  }

  async function wisUitslag(matchId, card) {
    if (!confirm('Uitslag verwijderen?')) return
    const { error } = await supabase.from('matches').update({ score_home: null, score_away: null }).eq('id', matchId)
    if (error) { alert('Fout: ' + error.message); return }
    document.getElementById(`home-${matchId}`).value = ''
    document.getElementById(`away-${matchId}`).value = ''
    card.classList.remove('has-score')
    card.querySelector('.wis-btn')?.remove()
  }

  async function slaUitslagOp(matchId, card) {
    const homeVal = document.getElementById(`home-${matchId}`).value
    const awayVal = document.getElementById(`away-${matchId}`).value
    const btn = card.querySelector('.opslaan-btn')

    if (homeVal === '' || awayVal === '') {
      const h = document.getElementById(`home-${matchId}`)
      const a = document.getElementById(`away-${matchId}`)
      h.style.borderColor = 'var(--red)'; a.style.borderColor = 'var(--red)'
      setTimeout(() => { h.style.borderColor = ''; a.style.borderColor = '' }, 1500)
      return
    }

    btn.textContent = '…'
    btn.disabled = true

    const { error } = await supabase.from('matches').update({
      score_home: parseInt(homeVal),
      score_away: parseInt(awayVal)
    }).eq('id', matchId)

    if (error) {
      alert('Fout: ' + error.message)
      btn.textContent = 'Opslaan'
      btn.disabled = false
    } else {
      btn.textContent = '✓ Opgeslagen'
      btn.classList.add('saved')
      card.classList.add('has-score')
      if (!card.querySelector('.wis-btn')) {
        const wisBtn = document.createElement('button')
        wisBtn.className = 'btn-secondary wis-btn'
        wisBtn.textContent = 'Wis'
        wisBtn.addEventListener('click', () => wisUitslag(matchId, card))
        card.querySelector('.score-form').appendChild(wisBtn)
      }
      setTimeout(() => {
        btn.textContent = 'Opslaan'
        btn.classList.remove('saved')
        btn.disabled = false
      }, 2000)
    }
  }

  async function slaNotesOp(matchId, card) {
    const notes = document.getElementById(`notes-${matchId}`).value.trim()
    const btn = card.querySelector('.notes-btn')
    btn.textContent = '…'
    btn.disabled = true
    const { error } = await supabase.from('matches').update({ notes: notes || null }).eq('id', matchId)
    if (error) {
      alert('Fout: ' + error.message)
    } else {
      btn.textContent = '✓ Opgeslagen'
      btn.style.color = 'var(--teal)'
      setTimeout(() => { btn.textContent = 'Info opslaan'; btn.style.color = ''; btn.disabled = false }, 2000)
      return
    }
    btn.textContent = 'Info opslaan'
    btn.disabled = false
  }

  // ── Sync scores ──────────────────────────────────────────

  document.getElementById('sync-btn').addEventListener('click', async () => {
    const btn = document.getElementById('sync-btn')
    const status = document.getElementById('sync-status')
    btn.disabled = true
    btn.textContent = '…'
    status.textContent = 'Bezig met ophalen…'
    status.style.color = ''

    let data, fetchError
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/sync-scores`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
        }
      })
      if (!res.ok) {
        const txt = await res.text()
        throw new Error(`HTTP ${res.status}: ${txt}`)
      }
      data = await res.json()
      console.log('Sync response:', JSON.stringify(data, null, 2))
    } catch (e) {
      fetchError = e
    }

    if (fetchError) {
      status.textContent = 'Fout: ' + fetchError.message
      status.style.color = 'var(--red)'
    } else if (data.updated > 0 || data.inserted > 0) {
      const parts = []
      if (data.updated > 0) parts.push(`${data.updated} uitslag${data.updated !== 1 ? 'en' : ''} bijgewerkt`)
      if (data.inserted > 0) parts.push(`${data.inserted} wedstrijd${data.inserted !== 1 ? 'en' : ''} toegevoegd`)
      status.textContent = `✓ ${parts.join(', ')}`
      status.style.color = 'var(--teal)'
      laadUitslagen()
    } else {
      status.textContent = `Geen wijzigingen (${data.total_api ?? data.checked ?? 0} wedstrijden van API)`
      status.style.color = 'var(--text-mid)'
    }
    if (data?.errors?.length) {
      status.textContent += ` · ⚠️ ${data.errors[0]}`
      status.style.color = 'var(--red)'
    }
    if (data?.skipped?.length) {
      status.textContent += ` · overgeslagen: ${data.skipped.join(', ')}`
    }

    btn.textContent = '⟳ Sync nu'
    btn.disabled = false
  })

  // ── Voorspellingen ───────────────────────────────────────

  async function laadVoorspellingen() {
    const container = document.getElementById('tab-voorspellingen')
    container.innerHTML = '<p class="empty-state">Laden…</p>'

    const [{ data: participants }, { data: matches }, { data: predCounts }] = await Promise.all([
      supabase.from('participants').select('id, name').order('name'),
      supabase.from('matches').select('id'),
      supabase.rpc('get_prediction_counts'),
    ])

    const totalMatches = (matches || []).length
    container.innerHTML = ''

    if (!participants || participants.length === 0) {
      container.innerHTML = '<p class="empty-state">Geen deelnemers</p>'
      return
    }

    const countMap = {}
    ;(predCounts || []).forEach(r => { countMap[r.participant_id] = Number(r.cnt) })

    const sorted = [...participants]
      .filter(p => p.id !== 22)
      .sort((a, b) => (countMap[b.id] || 0) - (countMap[a.id] || 0))

    const label = document.createElement('div')
    label.className = 'section-label'
    label.textContent = `${totalMatches} wedstrijden totaal`
    container.appendChild(label)

    sorted.forEach(p => {
      const count = countMap[p.id] || 0
      const pct   = totalMatches > 0 ? Math.round(count / totalMatches * 100) : 0
      const color = pct === 100 ? 'var(--teal)' : pct >= 50 ? 'var(--purple-l)' : 'var(--pink)'

      const row = document.createElement('div')
      row.className = 'pred-row'
      row.innerHTML = `
        <div class="pred-top">
          <div class="deelnemer-info">
            <div class="deelnemer-avatar" style="background:none;padding:0;overflow:hidden">${shirtSvg(p.name)}</div>
            <span class="deelnemer-naam">${p.name}</span>
          </div>
          <span class="pred-count" style="color:${color}">${count} / ${totalMatches}</span>
        </div>
        <div class="pred-bar-bg">
          <div class="pred-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      `
      container.appendChild(row)
    })
  }

  function parseMatchDate(str) {
    return str ? new Date(str.includes('+') || str.endsWith('Z') ? str : str + '+02:00') : null
  }

  function formatDate(dateStr) {
    return parseMatchDate(dateStr).toLocaleDateString('nl-NL', {
      weekday: 'short', day: 'numeric', month: 'short',
      hour: '2-digit', minute: '2-digit'
    })
  }
</script>
</body>
</html>
